<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쉼표 웹 시연판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* 쉼표 앱(Compose) 화면을 그대로 옮긴다. 단위 1px = 앱의 1dp. 화면 전체(1708dp 폭)를 기기 크기에 맞춰 통째로 줄이거나 키운다.
   색: Pleos Connect 시맨틱 토큰(PleosColors.kt), 글자: ShimpyoType(PleosTheme.kt) 그대로. */
:root{
  --bg:#F7F8FA;            /* backgroundPrimary(라이트 화면 바탕) */
  --panel:#FFFFFF;         /* 시연 도구 패널·지도 면 */
  --ink:#131417;           /* textPrimary */
  --ink2:rgba(19,20,23,.84);/* textSecondary */
  --ink3:rgba(19,20,23,.64);/* textTertiary */
  --ink4:rgba(19,20,23,.32);/* textQuaternary */
  --dim1:rgba(19,20,23,.05);/* dimPrimary */
  --dim2:rgba(19,20,23,.10);/* dimSecondary */
  --dim3:rgba(19,20,23,.20);/* dimTertiary */
  --on-ink:#FFFFFF;        /* 채운 버튼·칩 글자 */
  --positive:#0064FF; --overlay:rgba(19,20,23,.20);
  --lv0:#131417; --lv1:#B07A00; --lv2:#C25E00; --lv3:#F62E24;
  --font:"Asta Sans","Noto Sans KR",system-ui,sans-serif;
  --shadow-l1:0 6px 12px rgba(0,0,0,.08);
  --shadow-l3:0 20px 20px rgba(0,0,0,.24),0 2px 2px rgba(0,0,0,.20);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131417; --panel:#1D1E21; --ink:#FFFFFF; --ink2:rgba(255,255,255,.84); --ink3:rgba(255,255,255,.64); --ink4:rgba(255,255,255,.32);
    --dim1:rgba(255,255,255,.05); --dim2:rgba(255,255,255,.10); --dim3:rgba(255,255,255,.20); --on-ink:#131417;
    --positive:#0082FF; --overlay:rgba(19,20,23,.50); --lv0:#FFFFFF; --lv1:#FFC224; --lv2:#FF8A00; --lv3:#FF4339; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131417; --panel:#1D1E21; --ink:#FFFFFF; --ink2:rgba(255,255,255,.84); --ink3:rgba(255,255,255,.64); --ink4:rgba(255,255,255,.32);
  --dim1:rgba(255,255,255,.05); --dim2:rgba(255,255,255,.10); --dim3:rgba(255,255,255,.20); --on-ink:#131417;
  --positive:#0082FF; --overlay:rgba(19,20,23,.50); --lv0:#FFFFFF; --lv1:#FFC224; --lv2:#FF8A00; --lv3:#FF4339; color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--positive);outline-offset:3px}
/* 앱 크기 무대: 기기 화면에 맞춰 통째로 확대·축소 */
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000}
#screen{position:absolute;inset:0;background:var(--bg);transition:transform .45s cubic-bezier(.2,.9,.25,1),border-radius .45s,filter .45s;transform-origin:50% 50%}
#stage.sheet-open #screen{transform:scale(.95);border-radius:44px;filter:blur(20px)}
.wide{position:absolute;inset:0;padding:56px 72px 64px;display:flex;flex-direction:column}
/* 머리글 */
.hdr{height:56px;display:flex;align-items:center;flex:none}
.word{font-size:32px;line-height:40px;font-weight:400;letter-spacing:.64px}
.cap{font-size:24px;line-height:28px;font-weight:400;color:var(--ink3)}
.hdr .grow{flex:1}
.hdr .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:12px}
.hdr .dot.rest{background:var(--positive)}
.hdr .gap{width:28px}
.hdr .div{width:2px;height:24px;background:var(--dim3)}
.hdr .act{font-size:24px;line-height:28px;color:var(--ink2);min-height:56px;padding:14px 0 14px 28px}
/* 가운데 */
.mid{flex:1;display:flex;align-items:center;min-height:0}
.dialcol{width:600px;align-self:stretch;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.narr{flex:1;min-width:0;margin-left:96px}
.phase{font-size:64px;line-height:80px;font-weight:300;letter-spacing:-.64px;margin:0}
.lead{margin-top:28px;min-height:144px;max-width:760px;color:var(--ink2);font-size:32px;line-height:48px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.lead.m{font-size:28px;line-height:40px}.lead.s{font-size:26px;line-height:36px}
.reply{margin-top:24px;min-height:36px;display:flex;align-items:center;gap:16px;font-size:26px;line-height:34px;color:var(--ink3)}
.reply .said{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{width:32px;height:32px;flex:none}
.loading circle,.loading path{fill:none;stroke-width:8}
/* PleosLoading 그대로: 2초에 세 바퀴, 일정한 속도. 그룹을 돌려 시작 각도(12시)를 지킨다. */
.loading .spin{transform-box:view-box;transform-origin:32px 32px;animation:rot 2s linear infinite;will-change:transform}
@keyframes rot{to{transform:rotate(1080deg)}}
.talk{margin-left:8px;height:48px;padding:0 24px;border-radius:24px;background:var(--positive);color:#fff;font-size:22px;font-weight:700}
#micBanner{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:min(1100px,calc(100% - 48px));box-sizing:border-box;padding:24px 32px;border-radius:28px;background:var(--panel);box-shadow:var(--shadow-l3);border:3px solid var(--lv3);display:flex;flex-direction:column;gap:6px;z-index:5;cursor:pointer}
#micBanner b{font-size:26px;line-height:34px;color:var(--lv3)}
#micBanner span{font-size:28px;line-height:38px;color:var(--ink)}
#micBanner i{font-style:normal;font-size:20px;line-height:26px;color:var(--ink3)}
.micerr{color:var(--lv3);font-size:22px;line-height:28px;white-space:normal}
.talk.live{background:var(--lv3)}
.pad{margin-top:20px}
.pad .hint{font-size:22px;line-height:28px;color:var(--ink3);margin-bottom:12px}
.pad .hint.on{color:var(--ink)}
.pad .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pad .chip.key{width:64px;padding:0;justify-content:center}
.journey{margin-top:56px;height:64px;position:relative}
.journey svg{position:absolute;left:0;top:0;width:100%;height:16px;overflow:visible}
.journey .lab{position:absolute;top:32px;width:160px;font-size:22px;line-height:28px;white-space:nowrap}
.rule{margin-top:48px;height:2px;background:var(--dim2)}
.facts{margin-top:36px;display:flex}
.fact{flex:1;padding-right:24px;min-width:0}
.fact small{display:block;font-size:22px;line-height:28px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .v{margin-top:10px;display:flex;align-items:flex-end}
.fact b{font-size:44px;line-height:52px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact i{font-style:normal;font-size:26px;line-height:34px;color:var(--ink3);margin-left:6px;padding-bottom:4px;white-space:nowrap}
/* 행동 버튼 */
.acts{display:flex;align-items:center;gap:16px;flex:none}
.acts .grow{flex:1}
.pill{min-width:200px;height:100px;border-radius:50px;padding:0 56px;font-size:30px;line-height:38px;white-space:nowrap;transition:transform .15s,background .2s}
.pill.filled{background:var(--ink);color:var(--on-ink);font-weight:700}
.pill.filled:disabled{background:var(--dim1);color:var(--ink4);cursor:default}
.pill.outline{border:2px solid var(--dim3);color:var(--ink)}
.pill.quiet{padding:0 40px;color:var(--ink3)}
.pill:active,.chip:active{transform:scale(.96)}
/* 계기·지도 */
.dial{position:relative}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .n{font-weight:300;letter-spacing:-.02em;line-height:1}
.dial .c{margin-top:20px;display:flex;align-items:center;gap:12px;font-size:26px;line-height:34px;color:var(--ink3)}
.dial .c i{width:8px;height:8px;border-radius:50%}
.map{position:relative;border-radius:40px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-l1)}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map .t{position:absolute;left:28px;top:24px;font-size:22px;line-height:28px;color:var(--ink3);pointer-events:none}
.map .b{position:absolute;right:28px;bottom:18px;font-size:22px;line-height:28px;color:var(--ink3);pointer-events:none}
.map .a{position:absolute;right:28px;top:24px;font-size:22px;line-height:28px;color:var(--ink3);pointer-events:none}
/* 흐림 전환(BlurSwap) */
.swap{animation:swapin .45s cubic-bezier(.2,.9,.25,1)}
/* 흐림(filter) 없이 투명도·위치만: 태블릿에서 큰 글자에 blur를 걸면 프레임이 떨어지고 흐린 채로 멈춰 보일 수 있다. */
@keyframes swapin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 시연 도구 */
#scrim{position:absolute;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .4s}
#stage.sheet-open #scrim{opacity:1;pointer-events:auto}
#sheet{position:absolute;top:24px;bottom:24px;right:24px;width:640px;border-radius:40px;background:var(--panel);box-shadow:var(--shadow-l3);padding:48px;display:flex;flex-direction:column;transform:translateX(calc(100% + 48px));transition:transform .45s cubic-bezier(.2,.9,.25,1)}
#stage.sheet-open #sheet{transform:none}
.handle{width:48px;height:5px;border-radius:3px;background:var(--dim3);margin:0 auto 20px}
.shead{display:flex;align-items:center}
.shead h3{margin:0;font-size:36px;line-height:44px;font-weight:400}
.shead small{display:block;font-size:22px;line-height:28px;color:var(--ink3)}
.shead button{margin-left:auto;font-size:26px;line-height:34px;color:var(--ink3);min-height:56px;padding:11px 0 11px 24px}
.tabs{margin-top:20px;position:relative;border-bottom:2px solid var(--dim2);display:flex;gap:40px}
.tabs button{font-size:28px;line-height:36px;padding:12px 0 19px;color:var(--ink3);transition:color .2s}
.tabs button.on{color:var(--ink)}
.tabs .ul{position:absolute;bottom:-2px;height:3px;background:var(--ink);transition:left .3s cubic-bezier(.2,.9,.25,1),width .3s}
.sbody{flex:1;overflow:auto;margin-top:12px;scrollbar-width:thin}
.lrow{height:88px;display:flex;align-items:center;border-bottom:2px solid var(--dim2)}
.lrow .l{flex:1;font-size:28px;line-height:36px}
.lrow .r{font-size:26px;line-height:34px;color:var(--ink3)}
.lrow .r.on{color:var(--ink)}
.lrow .r+.switch{margin-left:24px}
.switch{width:88px;height:52px;border-radius:26px;background:var(--dim3);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;left:6px;top:6px;width:40px;height:40px;border-radius:20px;background:#fff;transition:left .25s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:var(--ink)}
.switch.on::after{left:42px;background:var(--on-ink)}
.grp{margin-top:36px}
.grp h4{margin:0 0 16px;font-size:22px;line-height:28px;font-weight:400;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{height:64px;border-radius:32px;border:2px solid var(--dim3);padding:0 28px;font-size:24px;line-height:28px;white-space:nowrap;display:inline-flex;align-items:center;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
.note{margin-top:12px;font-size:22px;line-height:28px;color:var(--ink3)}
.note.live{color:var(--positive)}
.loglist{padding-top:16px;display:flex;flex-direction:column;gap:18px}
.loglist div{display:flex}
.loglist time{width:120px;flex:none;font-size:22px;line-height:28px;color:var(--ink3);padding-top:3px}
.loglist span{font-size:26px;line-height:34px;color:var(--ink2);user-select:text}
.diag div{padding:16px 0;font-size:24px;line-height:28px;color:var(--ink2);border-top:2px solid var(--dim1)}
.diag div:first-child{border-top:0}
/* 좁은 화면(세로): 앱의 좁은 배치 */
.compact .wide{padding:40px}
.compact .mid{flex-direction:column;align-items:stretch;overflow:auto;padding:24px 0;gap:32px}
.compact .dialcol{width:auto;align-self:auto}
.compact .narr{margin-left:0}
.compact .journey{display:none}
.compact #sheet{width:auto;left:24px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ── Pleos Connect 차량 화면 틀: 에뮬레이터(2560×1440) 화면을 캡처해 그대로 붙인다. 앱은 오른쪽 1707×1212 자리에 들어간다. ── */
#device{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;background:#000;overflow:hidden}
body.framed #device{width:2560px;height:1440px}
body.framed #stage{left:853px;top:88px}
body:not(.framed) .fr{display:none!important}
.fr{position:absolute}
.fr img{display:block;pointer-events:none;-webkit-user-drag:none}
#fLeft{left:0;top:0;width:853px;height:1300px;background:#f1f1f1}
#fMedia{left:0;top:1120px;width:853px;height:180px}
#fTop{left:853px;top:0;width:1707px;height:88px}
#fClock{position:absolute;left:1536px;top:9px;width:160px;padding-right:12px;height:70px;box-sizing:content-box;background:#f7f7f7;color:#111;font-size:34px;line-height:70px;text-align:right;white-space:nowrap;font-family:"Noto Sans KR",var(--font);letter-spacing:-.3px}
#fMic{position:absolute;left:1175px;top:12px;width:64px;height:64px;border-radius:50%;background:#1fb53b;display:flex;align-items:center;justify-content:center}
#fMic[hidden]{display:none}
/* 캡처 위에 덮어 실제 상태를 보여 주는 칸: 속도·기어(P R N D) */
#fSpd{position:absolute;left:300px;top:16px;width:250px;height:58px;background:#fff;display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:4px;box-sizing:border-box;color:#9a9a9a;font-family:"Noto Sans KR",var(--font)}
#fSpd b{font-weight:400;font-size:38px;line-height:50px}
#fSpd small{font-size:28px}
#fGear{position:absolute;left:672px;top:16px;width:170px;height:58px;background:#fff;font-family:"Noto Sans KR",var(--font)}
#fGear b{cursor:pointer;position:absolute;top:5px;height:47px;width:40px;margin-left:-20px;text-align:center;font-weight:400;font-size:34px;line-height:47px;color:#c4c4c4}
#fGear b.on{background:#2b2b2b;color:#fff;width:48px;margin-left:-24px}
#fHandle{left:2541px;top:694px;display:flex;flex-direction:column;gap:10px}
#fHandle i{width:9px;height:9px;background:#111}
#fDock{left:0;top:1300px;width:2560px;height:140px}

</style>
</head>

  if (tab === "log") setHTML($("log"), S.logs.length ? S.logs.map(l => `<div><time>${l.slice(0, 8)}</time><span>${esc(l.slice(10))}</span></div>`).join("") : `<span style="font-size:26px;color:var(--ink3);padding-top:24px">운행을 시작하면 쉼표가 한 일을 여기에 차례로 적어요.</span>`);
  if (tab === "diag") setHTML($("tab-diag"), [
    `차량: 가상 차량(웹 시연판). 실제 차에서는 Pleos Vehicle SDK로 공조·시트·조명·창문을 바꿔요`,
    `내비: 가상 내비 · 경유지는 화면 지도에만 표시`,
    `음성 출력: ${Voice.tts ? (Voice.koVoice ? `기기 한국어 음성(${Voice.koVoice.name})` : "기기 기본 음성") : "지원 안 됨 → 글로만 표시"}`,
    `<b>마이크 진단</b>`,
    `열린 방식: ${window.claude ? "공유 링크(claude.ai)" : location.protocol === "https:" ? "https 주소" : location.protocol === "file:" ? "파일(file://) · 크롬이 허용을 저장 못 함" : location.protocol + " 주소"} · 보안 연결 ${window.isSecureContext ? "예" : "아니오(마이크 차단됨)"}`,
    `브라우저: ${/SamsungBrowser/.test(navigator.userAgent) ? "삼성 인터넷(음성 인식 없음 → 크롬으로 열기)" : /Chrome\//.test(navigator.userAgent) ? "크롬" : "기타"} · 음성 인식 ${Voice.Rec ? "있음" : "없음"} · 받아쓰기 ${dict ? "있음" : window.claude ? "없음" : "해당 없음"}`,
    `마이크 권한: ${micPerm} · 마이크 대답 ${Voice.micOn ? "켜짐" : "꺼짐"} · 지금 ${micLive ? "듣는 중" : "쉬는 중"}`,
    `마지막 문제: ${micErr || "없음"}`,
    `최근 마이크 기록: ${micEvents.length ? micEvents.map(esc).join(" / ") : "없음"}`,
    `음성 인식: ${dict ?"받아쓰기 · 질문 뒤 ‘말하기’를 눌러 말해요" : Voice.Rec ? "기기 음성 인식(‘마이크로 대답’을 켜면 질문마다 들어요)" : "지원 안 됨 → 시연 도구의 대답 버튼"}`,
    `지도: 내장 기본 지도(해안선·고속도로·도시, 인터넷 없이 표시) ·쉼터까지 도로 경로 ${routeCache ? "OSRM" : "(받으면 표시, 못 받으면 점선)"}`,
    `졸음쉼터 공공데이터: ${shelters.length}곳(한국도로공사, 2026-02-25)`,
  ].map(x => `<div>${x}</div>`).join(""));
  const on = document.querySelector(`#tabs [data-tab="${tab}"]`), ul = $("ul"); ul.style.left = on.offsetLeft + "px"; ul.style.width = on.offsetWidth + "px";
}

// 조작
let audioPrimed = false;
function primeAudio() { if (audioPrimed || !Voice.tts) return; audioPrimed = true; try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { } }
stage.addEventListener("click", e => {
  primeAudio();
  const b = e.target.closest("[data-a],[data-t],[data-pad],[data-tab]"); if (!b) return;
  if (b.id === "btnClose") return;
  if (b.dataset.tab) { tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); ["ctl", "log", "diag"].forEach(t => $("tab-" + t).hidden = t !== tab); ["tab-ctl", "log", "tab-diag"].forEach(id => $(id)._html = null); renderTools(); return; }
  if (b.dataset.pad !== undefined) { padAnswer(b.dataset.pad); return; }
  const a = b.dataset.a;
  if (a === "talk") return; // 누르는 순간 armDictation()이 이미 마이크를 켰다.
  if (a === "map") { const auto = !!S.offered || (!!S.restStop && (S.phase === "EN_ROUTE" || S.phase === "WAITING_PARK")); mapChoice = !(mapChoice ?? auto); }
  else if (a === "scope") mapScope = mapScope === "NEARBY" ? "COUNTRY" : "NEARBY";
  else if (a === "tools") { stage.classList.add("sheet-open"); }
  else if (a === "start") startTrip();
  else if (a === "stop") stopTrip();
  else if (a === "restNow") requestRestNow();
  else if (a === "cancelRest") cancelRest();
  else if (a === "padKey") padEntry = (padEntry + b.dataset.v).slice(0, 6);
  else if (a === "padDel") padEntry = padEntry.slice(0, -1);
  else if (a === "padSend") { if (padEntry) { padAnswer(padEntry); padEntry = ""; } }
  const t = b.dataset.t, v = b.dataset.v;
  if (t === "speed") { advanceClock(); S.speedOn = !S.speedOn; }
  else if (t === "frame") { frameOn = !frameOn; try { localStorage.setItem("shimpyo.frame", frameOn ? "1" : "0"); } catch (e) { } fit(); }
  else if (t === "full") { if (document.fullscreenElement) document.exitFullscreen().catch(() => { }); else { fullTried = true; goFull(); } setTimeout(render, 400); }
  else if (t === "tts") { Voice.ttsOn = !Voice.ttsOn; if (!Voice.ttsOn) Voice.stop(); }
  else if (t === "mic") { if (!Voice.Rec) micNote("이 브라우저는 음성 인식을 지원하지 않아요. 갤럭시탭의 ‘크롬’으로 열어 주세요."); else { Voice.micOn = !Voice.micOn; micErrRun = 0; if (!Voice.micOn) micStop(); else { micAsked = false; askMic(); if (Voice.pending) micEnsure(); } } }
  else if (t === "mictest") micTest();
  else if (t === "auto") S.autoAnswer = !S.autoAnswer;
  else if (t === "hour") S.demoHour = v === "" ? null : +v;
  else if (t === "game") demoStartGame(v);
  else if (t === "correct") injectCorrect();
  else if (t === "say") { const [txt, ms] = v.split("|"); inject(txt, ms === "" ? null : +ms); }
  else if (t === "park") { S.parked = v === "1"; log(S.parked ? "주차 확인" : "주행 가능 상태"); }
  else if (t === "pax") { S.manualPassenger = v === "1"; log(S.manualPassenger ? "동승자 있음" : "혼자"); if (!S.manualPassenger && playMode === "TEAM") playMode = "SOLO"; }
  else if (t === "teampref") { if (!S.parked) log("같이하기 기본값은 주차 중에만 바꿀 수 있어요."); else S.teamPref = v; }
  else if (t === "watch") S.watch = v === "" ? null : +v;
  else if (t === "cal") S.calendar = !S.calendar;
  else if (t === "vdrive") { S.virtualDrive = true; if (S.phase !== "IDLE") S.parked = false; log("가상 주행: 진행 방향 앞쪽 쉼터 쪽으로 달려요"); }
  else if (t === "vstop") S.virtualDrive = false;
  else if (t === "arrive") { if (S.phase === "EN_ROUTE") { log("가상 주행: 경유지 도착"); arrive(); } else log("경유지로 가는 중일 때 눌러 주세요."); }
  render();
});
let enRouteTalkAt = 0, enRouteFirst = true;
// 가상 차량 자동 진행: 실제 차에서는 운전자가 쉼터까지 달려가 주차하지만, 웹 시연에서는 화면이 대신 한다.
// ① 쉼터 안내(EN_ROUTE)가 시작되면 차가 쉼터 쪽으로 달려 약 40초 안에 도착 ② ‘주차하면 쉬어요’에서 4초 뒤 자동 주차(P) → 15분 휴식 시작.
setInterval(() => {
  if (S.phase === "EN_ROUTE") {
    if (S.parked) S.parked = false;
    if (!S.virtualDrive) { S.virtualDrive = true; S.autoNav = true; log("가상 주행: 쉼터까지 자동으로 달려요"); }
    if (S.restStop && !S.enRouteStep) S.enRouteStep = Math.max(0.05, distKm(S.location, S.restStop) / 40);
    // 도로 경로(OSRM)를 받았으면 그 길을 따라 달린다. 못 받았으면(공유 링크 등) 지도에 점선으로 보이는 대로 곧장 간다.
    const rc = S.restStop && routeCache && routeCache.to === S.restStop.name ? routeCache : null;
    if (rc && !S.parked) {
      if (S.routeFor !== rc) { S.routeFor = rc; S.routeIdx = 0; S.enRouteStep = Math.max(0.05, rc.m / 1000 / 40); }
      S.routeDrive = true;
      let budget = S.enRouteStep; const pts = rc.pts;
      while (budget > 0 && S.routeIdx < pts.length - 1) {
        const nx = { lat: pts[S.routeIdx + 1][0], lon: pts[S.routeIdx + 1][1] }, prev = S.location, d = distKm(prev, nx);
        if (d <= budget) { S.location = nx; budget -= d; S.routeIdx++; } else { S.location = moveToward(prev, nx, budget); budget = 0; }
        if (distKm(prev, S.location) > 0.002) { S.heading = bearing(prev, S.location); updateTravel(); }
      }
      if (S.routeIdx >= pts.length - 1 || distKm(S.location, S.restStop) < 0.05) {
        S.location = { lat: S.restStop.lat, lon: S.restStop.lon }; S.routeDrive = false; S.routeFor = null;
        log(`가상 주행: ${S.restStop.spoken} 도착`); arrive();
      }
    } else S.routeDrive = false;
    // 쉼터까지 가는 동안에도 짧은 퀴즈로 깨워 둔다(가장 졸린 구간). 한 판이 끝나면 4초 쉬고 다음 판.
    if (busy || S.listening) enRouteTalkAt = performance.now();
    else if (S.phase === "EN_ROUTE" && performance.now() - enRouteTalkAt > 4000) {
      enRouteTalkAt = performance.now();
      const near = () => shelters.map(s => ({ s, km: distKm(S.location, s) })).filter(x => x.km <= 40).sort((a, b) => a.km - b.km).slice(0, 3).map(x => x.s);
      let g = null;
      for (const k of shuffle(["DISTANCE", "REGION", "OX", "ARITHMETIC", "GUGUDAN", "NONSENSE", "CHOSUNG"])) {
        g = k === "REGION" ? RegionQuiz(near(), isTeam()) : k === "DISTANCE" ? DistanceGuess(aheadList(S.location, S.heading, 2)) : makeGame(k);
        if (g) break;
      }
      if (g) { const intro = enRouteFirst ? "쉼터까지 가는 동안 퀴즈로 깨어 있어 볼게요." : null; enRouteFirst = false; gamesStarted++; run(() => talk(g, 2, intro, isTeam(), true)); }
    }
  } else { S.enRouteStep = 0; S.routeDrive = false; S.routeFor = null; enRouteFirst = true; }
  if (S.phase === "WAITING_PARK" && !S.parked) {
    S.parkWait = (S.parkWait || 0) + 1;
    if (S.parkWait >= 4) { S.parked = true; S.parkWait = 0; if (S.autoNav) { S.virtualDrive = false; S.autoNav = false; } log("차량: 주차(P) · 주차 브레이크"); render(); }
  } else S.parkWait = 0;
}, 1000);
// 왼쪽 차량 화면의 P R N D를 눌러 직접 바꿀 수도 있다.
$("fGear").addEventListener("click", e => {
  const b = e.target.closest("b[data-g]"); if (!b) return;
  const g = b.dataset.g; if (g === "P") S.parked = true; else if (g === "D") S.parked = false; else return;
  log(S.parked ? "차량: 주차(P)" : "차량: 주행(D)"); render();
});
function padAnswer(txt) {
  if (turn === "DRIVER") { fouls++; teamScore = Math.max(0, teamScore - 1); log("반칙: 운전자 차례에 화면으로 대답"); const m = "운전자분 차례였어요. 반칙이라 팀 점수 1점을 뺄게요."; S.spoken = m; Voice.say(m); render(); return; }
  if (Voice.pending) Voice.pending(txt, 1200);
}
$("micBanner").addEventListener("click", e => { e.stopPropagation(); micBannerClosed = true; render(); });
const closeTools = () => { stage.classList.remove("sheet-open"); };
$("btnClose").onclick = closeTools; $("scrim").onclick = closeTools;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTools(); });
fit();

</script>
