<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쉼표 — 모션 프로토타입</title>
<style>
@font-face { font-family: "Asta Sans"; src: url("../../app/src/main/res/font/asta_sans.ttf") format("truetype"); font-weight: 300 800; }
:root {
  --bg:#131417; --raised:#1D1E21; --t1:#FFFFFF; --t2:rgba(255,255,255,.84); --t3:rgba(255,255,255,.64); --t4:rgba(255,255,255,.32);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20); --fill:#FFFFFF; --onfill:#131417; --scrim:rgba(19,20,23,.5);
  --ease: cubic-bezier(.2,.8,.2,1);
}
.light {
  --bg:#F7F8FA; --raised:#FFFFFF; --t1:#131417; --t2:rgba(19,20,23,.84); --t3:rgba(19,20,23,.64); --t4:rgba(19,20,23,.32);
  --line:rgba(19,20,23,.10); --line2:rgba(19,20,23,.20); --fill:#131417; --onfill:#FFFFFF; --scrim:rgba(19,20,23,.2);
}
* { box-sizing:border-box; margin:0; }
html, body { background:#000; overflow:hidden; }
body { font-family:"Asta Sans",sans-serif; -webkit-font-smoothing:antialiased; }
#stage { position:relative; width:1700px; height:1184px; overflow:hidden; background:#000; }
#main { position:absolute; inset:0; background:var(--bg); color:var(--t1); padding:56px 72px 64px; display:grid; grid-template-rows:56px 1fr 100px; transform-origin:50% 50%; will-change:transform, filter; }
header { display:flex; align-items:center; }
.word { font-size:32px; letter-spacing:.02em; }
.meta { margin-left:auto; display:flex; align-items:center; font-size:24px; color:var(--t3); }
.meta .dot { width:8px; height:8px; border-radius:50%; background:var(--t3); margin-right:12px; transition:background .5s var(--ease); }
.meta .sep { width:2px; height:24px; background:var(--line2); margin:0 28px; }
.meta .tool { cursor:pointer; padding:14px 0; }
main { display:grid; grid-template-columns:600px 1fr; column-gap:96px; align-items:center; }
.dial { position:relative; width:560px; height:560px; justify-self:center; }
.dial canvas { position:absolute; inset:0; width:560px; height:560px; }
.dial .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.num { font-weight:300; font-size:168px; line-height:168px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; height:168px; }
.num.small { font-size:136px; line-height:168px; }
.cap { margin-top:20px; font-size:26px; line-height:34px; color:var(--t3); height:34px; }
.capdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:12px; vertical-align:middle; }
.phase { font-weight:300; font-size:64px; line-height:80px; letter-spacing:-.01em; height:80px; }
.said { margin-top:28px; font-size:32px; line-height:48px; color:var(--t3); max-width:760px; height:96px; }
.heard { margin-top:24px; height:36px; font-size:26px; line-height:36px; color:var(--t3); }
.heard b { font-weight:400; color:var(--t2); margin-right:16px; }
.spin { width:32px; height:32px; vertical-align:middle; margin-right:16px; animation:r 2s linear infinite; } @keyframes r { to { transform:rotate(1080deg); } }
.journey { margin-top:56px; position:relative; height:64px; }
.journey canvas { position:absolute; left:-20px; top:-12px; }
.journey .lab { position:absolute; top:32px; width:160px; font-size:22px; line-height:28px; height:28px; }
.facts { margin-top:48px; padding-top:36px; border-top:2px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); }
.fact small { display:block; font-size:22px; line-height:28px; height:28px; color:var(--t3); }
.fact .v { margin-top:10px; display:flex; align-items:flex-end; height:52px; }
.fact .n { font-weight:300; font-size:44px; line-height:52px; font-variant-numeric:tabular-nums; }
.fact .u { font-size:26px; line-height:34px; color:var(--t3); margin:0 0 4px 6px; height:34px; }
footer { position:relative; }
.btn { height:100px; padding:0 56px; border-radius:50px; border:0; font-family:inherit; font-size:30px; color:var(--t1); background:transparent; box-shadow:inset 0 0 0 2px var(--line2); transition:transform .35s cubic-bezier(.3,1.4,.5,1), background .3s, color .3s, box-shadow .3s; }
.btn.primary { background:var(--fill); color:var(--onfill); box-shadow:none; font-weight:700; }
.btn.quiet { box-shadow:none; color:var(--t3); padding:0 40px; }
.btn[disabled] { color:var(--t4); box-shadow:inset 0 0 0 2px var(--line); }
.btn.pressed { transform:scale(.96); transition:transform .12s var(--ease); }
.row { display:flex; align-items:center; gap:16px; height:100px; }
.row .sp { flex:1; }
.hint { font-size:24px; color:var(--t3); margin-left:8px; }

/* blur swap */
.swap { position:relative; display:block; }
.swap > span { display:block; transition: opacity .55s var(--ease), transform .6s var(--ease), filter .55s var(--ease); }
.swap > span.out { position:absolute; left:0; top:0; right:0; opacity:0; transform:translateY(-20%); filter:blur(14px); pointer-events:none; }
.swap > span.pre { opacity:0; transform:translateY(20%) scale(.98); filter:blur(14px); transition:none; }
.swap.center > span { text-align:center; }
/* rolling */
.roll { display:inline-flex; align-items:flex-end; }
.slot { position:relative; display:inline-block; overflow:visible; }
.slot > span { display:inline-block; transition: opacity .5s var(--ease), transform .55s var(--ease), filter .5s var(--ease); }
.slot > span.out { position:absolute; left:0; bottom:0; opacity:0; filter:blur(8px); }
.slot > span.out.up { transform:translateY(-50%); } .slot > span.out.down { transform:translateY(50%); }
.slot > span.pre { opacity:0; filter:blur(8px); transition:none; }
.slot > span.pre.up { transform:translateY(50%); } .slot > span.pre.down { transform:translateY(-50%); }

/* sheet */
#scrim { position:absolute; inset:0; background:var(--scrim); opacity:0; pointer-events:none; }
#panel { position:absolute; top:24px; right:24px; bottom:24px; width:640px; background:var(--raised); color:var(--t1); border-radius:40px; padding:48px; box-shadow:0 20px 40px rgba(0,0,0,.24), 0 2px 4px rgba(0,0,0,.2); transform:translateX(720px); }
.light #panel, #stage.light #panel { }
.grab { width:48px; height:5px; border-radius:3px; background:var(--line2); margin:0 auto 20px; }
#panel h2 { font-weight:400; font-size:36px; line-height:44px; display:flex; justify-content:space-between; align-items:center; }
#panel h2 span { font-size:26px; color:var(--t3); }
.tabs { position:relative; margin-top:20px; display:flex; gap:40px; border-bottom:2px solid var(--line); }
.tabs div { padding:12px 0 19px; font-size:28px; color:var(--t3); transition:color .3s var(--ease); }
.tabs div.on { color:var(--t1); }
.tabs i { position:absolute; bottom:-2px; height:3px; background:var(--t1); left:0; width:0; }
.tabbody { position:relative; margin-top:12px; height:calc(100% - 160px); }
.pane { position:absolute; inset:0; transition: opacity .45s var(--ease), transform .5s var(--ease); }
.pane.hide-l { opacity:0; transform:translateX(-25%); pointer-events:none; }
.pane.hide-r { opacity:0; transform:translateX(25%); pointer-events:none; }
.rowx { display:flex; align-items:center; height:88px; border-bottom:2px solid var(--line); font-size:28px; }
.rowx em { font-style:normal; margin-left:auto; color:var(--t3); font-size:26px; }
.sw { width:88px; height:52px; border-radius:26px; background:var(--line2); position:relative; margin-left:24px; transition:background .4s var(--ease); }
.sw i { position:absolute; top:6px; left:6px; width:40px; height:40px; border-radius:20px; background:#fff; transition:left .45s cubic-bezier(.3,1.35,.5,1), width .25s var(--ease), background .3s; }
.sw.on { background:var(--fill); } .sw.on i { left:42px; background:var(--onfill); }
.grp { margin-top:36px; } .grp small { font-size:22px; color:var(--t3); }
.chips { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
.chips span { height:64px; padding:0 28px; border-radius:32px; display:inline-flex; align-items:center; font-size:24px; box-shadow:inset 0 0 0 2px var(--line2); transition:background .3s var(--ease), color .3s, box-shadow .3s, transform .35s cubic-bezier(.3,1.4,.5,1); }
.chips .on { background:var(--fill); color:var(--onfill); box-shadow:none; }
.log { font-size:26px; line-height:34px; color:var(--t2); display:flex; gap:16px; margin-top:18px; }
.log time { width:120px; font-size:22px; color:var(--t3); flex:none; padding-top:3px; }
</style>
</head>
<body>
<div id="stage">
  <div id="main">
    <header><div class="word">쉼표</div>
      <div class="meta"><span class="dot" id="mdot"></span><span class="swap" id="mstat" style="min-width:120px"></span><span class="sep"></span><span class="tool" id="tool">시연 도구</span></div></header>
    <main>
      <div class="dial"><canvas id="dial" width="1120" height="1120"></canvas>
        <div class="c" id="dialc"><div class="swap center" id="num" style="min-width:420px"></div><div class="swap center cap" id="cap" style="min-width:420px"></div></div></div>
      <div id="right">
        <div class="swap phase" id="phase"></div>
        <div class="swap said" id="said"></div>
        <div class="swap heard" id="heard"></div>
        <div class="journey" id="jy"><canvas id="jc"></canvas><div class="swap lab" id="jlab"></div></div>
        <div class="facts" id="facts">
          <div class="fact"><small>연속 주행</small><div class="v"><span class="n roll" id="f1"></span><span class="u">분</span></div></div>
          <div class="fact"><small>대답 속도</small><div class="v"><span class="n roll" id="f2"></span><span class="u swap" id="f2u"></span></div></div>
          <div class="fact"><small class="swap" id="f3l"></small><div class="v"><span class="n swap" id="f3"></span><span class="u swap" id="f3u"></span></div></div>
        </div>
      </div>
    </main>
    <footer><div class="swap" id="actions"></div></footer>
  </div>
  <div id="scrim"></div>
  <div id="panel">
    <div class="grab"></div>
    <h2>시연 도구<span>닫기</span></h2>
    <div class="tabs" id="tabs"><div class="on">조작</div><div>기록</div><div>SDK 진단</div><i id="tabi"></i></div>
    <div class="tabbody">
      <div class="pane" id="p0">
        <div class="rowx">시연 배속<em>1초 = 1분</em><div class="sw" id="sw"><i></i></div></div>
        <div class="grp"><small>시각</small><div class="chips" id="hours"><span class="on">지금</span><span>새벽 2시</span><span>오후 2시</span><span>오전 10시</span></div></div>
        <div class="grp"><small>운전자 대답</small><div class="chips"><span>빠른 대답</span><span>느린 대답</span><span>무응답</span><span>“응, 쉬었다 가자”</span><span>“아니, 괜찮아”</span></div></div>
        <div class="grp"><small>차량</small><div class="chips"><span>주행</span><span class="on">주차</span></div></div>
      </div>
      <div class="pane hide-r" id="p1">
        <div class="log"><time>02:14:03</time>운행을 시작했어요.</div>
        <div class="log"><time>02:54:10</time>졸음 위험이 주의 단계로 올라갔어요.</div>
        <div class="log"><time>02:55:02</time>끝말잇기를 시작했어요.</div>
        <div class="log"><time>03:01:47</time>대답이 평소의 1.6배로 느려졌어요.</div>
        <div class="log"><time>03:02:30</time>칠곡 졸음쉼터를 경유지로 넣었어요.</div>
        <div class="log"><time>03:09:12</time>주차를 확인하고 15분 휴식을 시작했어요.</div>
      </div>
      <div class="pane hide-r" id="p2"></div>
    </div>
  </div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const stage = document.getElementById("stage");
if (Q.get("theme") === "light") stage.classList.add("light");
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(stage).getPropertyValue(n).trim();

// ── 스프링 (Compose 쪽과 같은 stiffness/damping) ──
class Spring {
  constructor(v, k = 158, z = 0.86) { this.v = v; this.t = v; this.vel = 0; this.k = k; this.c = 2 * z * Math.sqrt(k); }
  to(t) { this.t = t; return this; }
  step(dt) { const a = -this.k * (this.v - this.t) - this.c * this.vel; this.vel += a * dt; this.v += this.vel * dt; }
}
const SMOOTH = [158, .86], SNAPPY = [385, .80], SHEET = [224, .84];
const sp = {
  frac: new Spring(0, ...SMOOTH), morph: new Spring(0, ...SMOOTH), jpos: new Spring(0, ...SMOOTH), jact: new Spring(0, ...SMOOTH),
  r: new Spring(255, ...SMOOTH), g: new Spring(255, ...SMOOTH), b: new Spring(255, ...SMOOTH),
  sheet: new Spring(0, ...SHEET), tabx: new Spring(0, ...SNAPPY), tabw: new Spring(0, ...SNAPPY), breath: new Spring(0, ...SMOOTH),
};
let intro = 0, introStart = performance.now() + 150;

// ── 흐림 교체 ──
function swap(el, html) {
  if (el._v === html) return; el._v = html;
  [...el.children].forEach(c => { if (c.classList.contains("out")) c.remove(); else { c.classList.add("out"); setTimeout(() => c.remove(), 700); } });
  const s = document.createElement("span"); s.innerHTML = html; s.className = "pre"; el.appendChild(s);
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove("pre")));
}
// ── 숫자 굴리기 ──
function roll(el, text) {
  if (el._v === text) return;
  const prev = el._v || ""; el._v = text;
  const pn = parseFloat(prev.replace(/[^0-9.]/g, "")), nn = parseFloat(text.replace(/[^0-9.]/g, ""));
  const dir = !isNaN(pn) && !isNaN(nn) && nn < pn ? "down" : "up";
  const chars = [...text];
  while (el.children.length < chars.length) el.insertBefore(Object.assign(document.createElement("span"), { className: "slot" }), el.firstChild);
  while (el.children.length > chars.length) el.firstChild.remove();
  chars.forEach((ch, i) => {
    const slot = el.children[i];
    if (slot._v === ch) return; slot._v = ch;
    [...slot.children].forEach(c => { c.className = "out " + dir; setTimeout(() => c.remove(), 650); });
    const s = document.createElement("span"); s.textContent = ch; s.className = "pre " + dir; slot.appendChild(s);
    requestAnimationFrame(() => requestAnimationFrame(() => s.className = ""));
  });
}

// ── 화면 상태 ──
const steps = ["지켜보기", "대화", "쉼터 제안", "이동", "휴식"];
const levelColor = { "정상": [255,255,255], "주의": [255,194,36], "경고": [255,138,0], "휴식 권고": [255,67,57] };
let S = { phase:"출발할 준비가 됐어요", said:"운행을 시작하면 운전 시간과 대답을 조용히 살필게요.", heard:null, listening:false,
  step:-1, score:0, level:"정상", drive:0, resp:"–", respU:"", third:["쉼 제안","0","회 거절"], status:"주행", set:"idle", rest:false, restSec:900, parked:false };
function set(p) { Object.assign(S, p); render(); }

function render() {
  const light = stage.classList.contains("light");
  swap($("mstat"), S.rest ? "주차" : S.set === "idle" ? "주행" : `주행 ${S.drive}분`);
  $("mdot").style.background = S.rest ? (light ? "#0064FF" : "#0082FF") : "";
  const numHTML = S.rest ? `<span class="num small roll" data-k="rest"></span>` : `<span class="num roll" data-k="score"></span>`;
  if ($("num")._mode !== (S.rest ? "rest" : "score")) { $("num")._mode = S.rest ? "rest" : "score"; swap($("num"), numHTML); }
  const numEl = $("num").lastChild.querySelector(".roll");
  roll(numEl, S.rest ? `${Math.floor(S.restSec/60)}:${String(S.restSec%60).padStart(2,"0")}` : String(S.score));
  numEl.style.color = S.set === "idle" ? "var(--t4)" : "";
  const col = S.rest ? (light ? [0,100,255] : [0,130,255]) : (light && S.level === "정상" ? [19,20,23] : levelColor[S.level]);
  sp.r.to(col[0]); sp.g.to(col[1]); sp.b.to(col[2]);
  const cap = S.rest ? (S.parked ? "천천히 숨 쉬어요" : "남은 휴식") : S.set === "idle" ? "졸음 위험" : `<span class="capdot" style="background:rgb(${col})"></span>졸음 위험 ${S.level}`;
  swap($("cap"), cap);
  swap($("phase"), S.phase);
  swap($("said"), S.said);
  swap($("heard"), S.listening ? `<svg class="spin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="8"/><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-opacity=".84" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2*Math.PI*24*.28} 999" transform="rotate(-90 32 32)"/></svg>듣고 있어요`
    : S.heard ? `<b>“${S.heard[0]}”</b>${S.heard[1]}` : "&nbsp;");
  sp.jpos.to(Math.max(0, S.step)); sp.jact.to(S.step >= 0 ? 1 : 0);
  swap($("jlab"), S.step >= 0 ? steps[S.step] : "&nbsp;");
  roll($("f1"), String(S.drive));
  roll($("f2"), S.resp); swap($("f2u"), S.respU || "&nbsp;");
  swap($("f3l"), S.third[0]); swap($("f3"), S.third[1]); swap($("f3u"), S.third[2] || "&nbsp;");
  sp.frac.to(S.rest ? S.restSec / 900 : S.set === "idle" ? 0 : S.score / 100);
  sp.morph.to(S.rest ? 1 : 0);
  sp.breath.to(S.rest && S.parked ? 1 : 0);
  const acts = {
    idle: `<div class="row"><button class="btn primary" id="go">운행 시작</button><span class="hint">대답은 말로 하면 돼요</span></div>`,
    active: `<div class="row"><button class="btn primary" id="go">지금 쉬기</button><button class="btn" ${S.step === 3 ? "" : "disabled"}>휴식 취소</button><span class="sp"></span><button class="btn quiet">운행 종료</button></div>`,
    rest: `<div class="row"><button class="btn primary" id="go">휴식 마치기</button><span class="sp"></span><button class="btn quiet">운행 종료</button></div>`,
  };
  const key = S.rest ? "rest" : S.set;
  if ($("actions")._k !== key + S.step) { const changeSet = ($("actions")._set !== key); $("actions")._k = key + S.step; $("actions")._set = key;
    if (changeSet) swap($("actions"), acts[key]); else { $("actions").lastChild.innerHTML = acts[key]; } }
}

// ── 다이얼 그리기 ──
const dc = $("dial"), dx = dc.getContext("2d");
function drawDial(t) {
  const W = 1120, cx = W / 2, R = cx - 88;
  dx.clearRect(0, 0, W, W);
  const m = sp.morph.v, start = (135 + (-90 - 135) * m) * Math.PI / 180, sweep = (270 + 90 * m) * Math.PI / 180;
  const line = css("--line"), line2 = css("--line2");
  // 호흡 빛
  const br = sp.breath.v;
  if (br > 0.002) {
    const ph = ((t / 1000) % 10); const b = ph < 4 ? Math.sin(ph / 4 * Math.PI / 2) : Math.cos((ph - 4) / 6 * Math.PI / 2);
    const rr = R * (0.92 + 0.12 * b * br);
    const g = dx.createRadialGradient(cx, cx, 0, cx, cx, rr);
    g.addColorStop(0, `rgba(${sp.r.v|0},${sp.g.v|0},${sp.b.v|0},${(0.16*b+0.04)*br})`); g.addColorStop(1, "rgba(0,0,0,0)");
    dx.fillStyle = g; dx.beginPath(); dx.arc(cx, cx, rr, 0, 7); dx.fill();
  }
  const n = 60;
  for (let i = 0; i <= n; i++) {
    const tt = i / n; if (tt > intro) break;
    const appear = Math.min(1, Math.max(0, (intro - tt) * 12));
    const fadeLast = i === n ? 1 - m : 1;
    const a = start + sweep * tt, major = i % 5 === 0;
    const r1 = R + 52, r2 = R + (major ? 80 : 68);
    dx.globalAlpha = appear * fadeLast;
    dx.strokeStyle = major ? line2 : line; dx.lineWidth = 4; dx.lineCap = "round";
    dx.beginPath(); dx.moveTo(cx + r1 * Math.cos(a), cx + r1 * Math.sin(a)); dx.lineTo(cx + r2 * Math.cos(a), cx + r2 * Math.sin(a)); dx.stroke();
  }
  dx.globalAlpha = 1;
  dx.strokeStyle = line; dx.lineWidth = 4; dx.lineCap = "butt";
  dx.beginPath(); dx.arc(cx, cx, R, start, start + sweep * intro); dx.stroke();
  const f = Math.max(0, sp.frac.v) * intro;
  if (f > 0.003) {
    dx.strokeStyle = `rgb(${sp.r.v|0},${sp.g.v|0},${sp.b.v|0})`; dx.lineWidth = 12; dx.lineCap = "round";
    dx.beginPath(); dx.arc(cx, cx, R, start, start + sweep * f); dx.stroke();
  }
}
// ── 단계 선 ──
const jc = $("jc"), jx = jc.getContext("2d");
function drawJourney() {
  const w = $("jy").clientWidth; const W = (w + 40) * 2, H = 40 * 2;
  if (jc.width !== W) { jc.width = W; jc.height = H; jc.style.width = (w + 40) + "px"; jc.style.height = "40px"; }
  jx.setTransform(2, 0, 0, 2, 0, 0); jx.clearRect(0, 0, W, H);
  const y = 20, x0 = 20, step = w / 4, pos = Math.min(4, Math.max(0, sp.jpos.v)), act = Math.min(1, Math.max(0, sp.jact.v));
  const ink = css("--t1"), line = css("--line"), ring = css("--line2"), bg = css("--bg");
  jx.strokeStyle = line; jx.lineWidth = 2; jx.beginPath(); jx.moveTo(x0, y); jx.lineTo(x0 + w, y); jx.stroke();
  if (act > 0 && pos > 0) { jx.globalAlpha = act; jx.strokeStyle = ink; jx.beginPath(); jx.moveTo(x0, y); jx.lineTo(x0 + step * pos, y); jx.stroke(); jx.globalAlpha = 1; }
  for (let i = 0; i < 5; i++) {
    const px = x0 + step * i; const passed = Math.min(1, Math.max(0, pos - i + 1)) * act;
    jx.fillStyle = bg; jx.beginPath(); jx.arc(px, y, 8, 0, 7); jx.fill();
    jx.globalAlpha = 1 - passed; jx.strokeStyle = ring; jx.lineWidth = 2; jx.beginPath(); jx.arc(px, y, 7, 0, 7); jx.stroke();
    if (passed > 0) { jx.globalAlpha = passed; jx.fillStyle = ink; jx.beginPath(); jx.arc(px, y, 5 * passed, 0, 7); jx.fill(); }
    jx.globalAlpha = 1;
  }
  if (act > 0.01) {
    const px = x0 + step * pos;
    jx.globalAlpha = act; jx.fillStyle = line; jx.beginPath(); jx.arc(px, y, 16 * act, 0, 7); jx.fill();
    jx.fillStyle = ink; jx.beginPath(); jx.arc(px, y, 8 * act, 0, 7); jx.fill(); jx.globalAlpha = 1;
  }
  const lab = $("jlab"); const x = Math.min(Math.max(step * pos - 80, 0), w - 160);
  lab.style.left = x + "px";
  lab.style.textAlign = pos < .5 ? "left" : pos > 3.5 ? "right" : "center";
}

// ── 시트 ──
let sheetOpen = false, tab = 0;
function openSheet() { sheetOpen = true; sp.sheet.to(1); }
function closeSheet() { sheetOpen = false; sp.sheet.to(0); }
$("tool").onclick = openSheet; $("scrim").onclick = closeSheet; document.querySelector("#panel h2 span").onclick = closeSheet;
function selectTab(i) {
  const prev = tab; tab = i;
  [...$("tabs").children].forEach((d, k) => d.tagName === "DIV" && d.classList.toggle("on", k === i));
  ["p0","p1","p2"].forEach((id, k) => { const p = $(id); p.classList.remove("hide-l","hide-r"); if (k < i) p.classList.add("hide-l"); if (k > i) p.classList.add("hide-r"); });
  const el = $("tabs").children[i]; sp.tabx.to(el.offsetLeft); sp.tabw.to(el.offsetWidth);
}
[...$("tabs").querySelectorAll("div")].forEach((d, k) => d.onclick = () => selectTab(k));
function applySheet() {
  const p = Math.min(1, Math.max(0, sp.sheet.v)), raw = sp.sheet.v;
  const main = $("main");
  main.style.transform = `scale(${1 - 0.05 * p})`; main.style.borderRadius = `${44 * p}px`; main.style.filter = p > 0.002 ? `blur(${20 * p}px)` : "none";
  $("scrim").style.opacity = p; $("scrim").style.pointerEvents = sheetOpen ? "auto" : "none";
  $("panel").style.transform = `translateX(${(1 - raw) * 712}px)`;
  $("tabi").style.left = sp.tabx.v + "px"; $("tabi").style.width = sp.tabw.v + "px";
}

// ── 루프 ──
let last = performance.now();
function frame(t) {
  let dt = Math.min(0.05, (t - last) / 1000); last = t;
  const sub = 8; for (let k = 0; k < sub; k++) for (const s of Object.values(sp)) s.step(dt / sub);
  const ip = Math.min(1, Math.max(0, (t - introStart) / 1400)); intro = 1 - Math.pow(1 - ip, 3.2);
  const ti = Math.min(1, Math.max(0, (t - introStart - 100) / 1100));
  ["phase","said","heard","jy","facts"].forEach((id, k) => { const o = Math.min(1, Math.max(0, (ti - k * 0.07) / 0.79)); const e = 1 - Math.pow(1 - o, 3); const el = $(id); el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * 28}px)`; });
  const dce = $("dialc"); dce.style.opacity = intro; dce.style.transform = `translateY(${(1 - intro) * 24}px)`;
  drawDial(t); drawJourney(); applySheet();
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(() => { const el = $("tabs").children[0]; sp.tabx.v = sp.tabx.t = el.offsetLeft; sp.tabw.v = sp.tabw.t = el.offsetWidth; requestAnimationFrame(frame); });

// ── 시연 시나리오 (자동 재생, ?auto=0이면 끔) ──
function press(cb) { const b = $("go"); if (b) { b.classList.add("pressed"); setTimeout(() => { b.classList.remove("pressed"); cb(); }, 260); } else cb(); }
const timeline = [
  [1800, () => press(() => set({ set:"active", phase:"조용히 지켜보는 중", said:"운전 시간과 대답 속도를 함께 보고 있어요.", step:0, score:12, drive:62 }))],
  [3600, () => set({ score:34, level:"주의", drive:84, resp:"1.2", respU:"초 기준" })],
  [5000, () => set({ phase:"대화로 깨우는 중", said:"끝말잇기 해요. 제가 먼저 할게요. 바다. 이제 ‘다’로 시작하는 말을 해 주세요.", step:1, listening:true })],
  [7400, () => set({ listening:false, heard:["다람쥐","3.1초 만에 대답"], score:58, level:"경고", resp:"1.6", respU:"배", drive:86 })],
  [9200, () => set({ phase:"잠깐 쉬어 갈까요", said:"6킬로미터 앞에 칠곡 졸음쉼터가 있어요. 들렀다 갈까요?", step:2, heard:null, listening:true, score:71, level:"휴식 권고" })],
  [11000, () => set({ listening:false, heard:["응, 쉬었다 가자","2.6초 만에 대답"], phase:"쉼터로 안내하는 중", said:"칠곡 졸음쉼터를 경유지로 넣었어요. 안내를 따라가세요.", step:3, third:["경유 쉼터","칠곡",""] })],
  [13200, () => set({ rest:true, parked:true, restSec:900, phase:"잠시 쉬어 가요", said:"좌석을 눕히고 조명을 낮췄어요. 시간이 되면 환기하면서 깨워 드릴게요.", step:4, drive:104, resp:"2.1" })],
  [17600, () => openSheet()],
  [19000, () => { $("sw").classList.add("on"); }],
  [19600, () => { const h = $("hours").children; h[0].classList.remove("on"); h[1].style.transform = "scale(.94)"; setTimeout(() => { h[1].style.transform = ""; h[1].classList.add("on"); }, 150); }],
  [20600, () => selectTab(1)],
  [22000, () => closeSheet()],
];
let restTimer = null;
if (Q.get("auto") !== "0") {
  timeline.forEach(([ms, fn]) => setTimeout(fn, ms));
  setTimeout(() => { restTimer = setInterval(() => { if (S.rest && S.restSec > 0) set({ restSec: S.restSec - 1 }); }, 1000); }, 14200);
}
</script>
