<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쉼표 — 화면 시안</title>
<style>
@font-face { font-family: "Asta Sans"; src: url("../../app/src/main/res/font/asta_sans.ttf") format("truetype"); font-weight: 300 800; }
:root {
  --bg:#F7F8FA; --raised:#FFFFFF; --t1:#131417; --t2:rgba(19,20,23,.64); --t3:rgba(19,20,23,.64);
  --line:rgba(19,20,23,.10); --line2:rgba(19,20,23,.18); --fill:#131417; --onfill:#FFFFFF;
  --rest:#0064FF; --caution:#E0A300; --warning:#FF8A00; --danger:#F62E24; --scrim:rgba(19,20,23,.20);
}
.dark {
  --bg:#131417; --raised:#1D1E21; --t1:#FFFFFF; --t2:rgba(255,255,255,.64); --t3:rgba(255,255,255,.64);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18); --fill:#FFFFFF; --onfill:#131417;
  --rest:#0082FF; --caution:#FFC224; --scrim:rgba(0,0,0,.5);
}
* { box-sizing:border-box; margin:0; }
body { background:#000; font-family:"Asta Sans",sans-serif; -webkit-font-smoothing:antialiased; }
.screen { position:relative; width:1700px; height:1184px; background:var(--bg); color:var(--t1); overflow:hidden; padding:56px 72px 64px; display:grid; grid-template-rows:auto 1fr auto; }
header { display:flex; align-items:center; height:56px; }
.word { font-weight:400; font-size:32px; letter-spacing:.02em; }
.meta { margin-left:auto; display:flex; align-items:center; gap:28px; font-size:24px; color:var(--t2); }
.meta .sep { width:2px; height:24px; background:var(--line2); }
.meta .tool { color:var(--t2); }
.state-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--t2); margin-right:12px; vertical-align:middle; }
main { display:grid; grid-template-columns:600px 1fr; column-gap:96px; align-items:center; }
.dial { position:relative; width:560px; height:560px; justify-self:center; }
.dial svg { position:absolute; inset:0; overflow:visible; }
.dial .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.num { font-weight:300; font-size:168px; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.cap { margin-top:20px; font-size:26px; color:var(--t2); }
.right { display:flex; flex-direction:column; }
.phase { font-weight:300; font-size:64px; line-height:80px; letter-spacing:-.01em; }
.said { margin-top:28px; font-weight:400; font-size:32px; line-height:48px; color:var(--t2); max-width:760px; }
.heard { margin-top:24px; font-size:26px; color:var(--t3); display:flex; align-items:center; gap:16px; }
.heard b { font-weight:400; color:var(--t2); }
.spin { width:32px; height:32px; animation:r 2s linear infinite; } @keyframes r { to { transform:rotate(1080deg); } }
.journey { margin-top:56px; position:relative; height:64px; }
.journey .rail { position:absolute; left:0; right:0; top:7px; height:2px; background:var(--line); }
.journey .done { position:absolute; left:0; top:7px; height:2px; background:var(--t1); }
.journey .node { position:absolute; top:0; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 2px var(--line2); }
.journey .node.past { background:var(--t1); box-shadow:none; transform:scale(.6); }
.journey .node.now { background:var(--t1); box-shadow:0 0 0 8px var(--line); }
.journey .lab { position:absolute; top:36px; transform:translateX(-50%); font-size:22px; color:var(--t3); white-space:nowrap; }
.journey .lab.now { color:var(--t1); }
.facts { margin-top:48px; padding-top:36px; border-top:2px solid var(--line); display:grid; grid-template-columns:repeat(3, 1fr); }
.fact small { display:block; font-size:22px; color:var(--t3); }
.fact span { display:block; margin-top:10px; font-weight:300; font-size:44px; line-height:52px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.fact span em { font-style:normal; font-size:26px; color:var(--t2); margin-left:6px; }
footer { display:flex; align-items:center; gap:16px; }
footer .spacer { flex:1; }
.btn { height:100px; padding:0 56px; border-radius:50px; border:0; font-family:inherit; font-weight:400; font-size:30px; color:var(--t1); background:transparent; box-shadow:inset 0 0 0 2px var(--line2); }
.btn.primary { background:var(--fill); color:var(--onfill); box-shadow:none; font-weight:700; }
.btn.quiet { box-shadow:none; color:var(--t2); padding:0 40px; }
.btn[disabled] { color:var(--t3); box-shadow:inset 0 0 0 2px var(--line); }
.hint { font-size:24px; color:var(--t3); }
/* drawer */
.scrim { position:absolute; inset:0; background:var(--scrim); }
.drawer { position:absolute; top:24px; right:24px; bottom:24px; width:640px; background:var(--raised); border-radius:40px; padding:48px; box-shadow:0 20px 40px rgba(0,0,0,.24), 0 2px 4px rgba(0,0,0,.2); display:flex; flex-direction:column; }
.drawer h2 { font-weight:400; font-size:36px; display:flex; justify-content:space-between; align-items:center; }
.drawer h2 span { font-size:26px; color:var(--t2); }
.tabs { margin-top:32px; display:flex; gap:40px; border-bottom:2px solid var(--line); }
.tabs div { padding-bottom:18px; font-size:26px; color:var(--t3); }
.tabs .on { color:var(--t1); box-shadow:inset 0 -3px 0 var(--t1); }
.group { margin-top:36px; }
.group small { font-size:22px; color:var(--t3); }
.rowx { display:flex; align-items:center; justify-content:space-between; height:88px; border-bottom:2px solid var(--line); font-size:28px; }
.rowx em { font-style:normal; color:var(--t2); font-size:26px; }
.sw { width:88px; height:52px; border-radius:26px; background:var(--fill); position:relative; }
.sw::after { content:""; position:absolute; top:6px; right:6px; width:40px; height:40px; border-radius:50%; background:var(--onfill); }
.chips { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
.chips span { height:64px; padding:0 28px; border-radius:32px; display:inline-flex; align-items:center; font-size:24px; box-shadow:inset 0 0 0 2px var(--line2); }
.chips .on { background:var(--fill); color:var(--onfill); box-shadow:none; }
</style>
</head>
<body>
<div class="screen" id="s"></div>
<script>
const P = new URLSearchParams(location.search);
const scr = document.getElementById("s");
if (P.get("theme") === "dark") scr.classList.add("dark");
const mode = P.get("state") || "talk";
const drawer = P.get("drawer") === "1";
const S = {
  idle:  { phase:"출발할 준비가 됐어요", said:"운행을 시작하면 운전 시간과 대답을 조용히 살필게요.", step:-1, drive:"0", resp:"–", third:["쉼 제안","0","회 거절"], meta:"정차", dial:"idle" },
  talk:  { phase:"대화로 깨우는 중", said:"끝말잇기 해요. 제가 먼저 할게요. 바다. 이제 ‘다’로 시작하는 말을 해 주세요.", listening:true, step:1, drive:"86", resp:"1.6", third:["쉼 제안","1","회 거절"], meta:"주행 86분", dial:"risk", score:58, level:"경고", color:"var(--warning)" },
  rest:  { phase:"잠시 쉬어 가요", said:"좌석을 눕히고 조명을 낮췄어요. 시간이 되면 환기하면서 깨워 드릴게요.", heard:"응, 쉬었다 가자", lat:"2.6초", step:4, drive:"104", resp:"2.1", third:["경유 쉼터","칠곡",""], meta:"주차", dial:"rest" },
}[mode];
const steps = ["지켜보기","대화","쉼터 제안","이동","휴식"];

// dial: hairline ticks + fine arc
const size = 560, cx = 280, R = 250;
let ticks = "";
const span = S.dial === "rest" ? 360 : 270, start = S.dial === "rest" ? -90 : 135, n = S.dial === "rest" ? 60 : 50;
for (let i = 0; i <= n; i++) {
  if (S.dial === "rest" && i === n) break;
  const a = (start + span * i / n) * Math.PI / 180, major = i % 5 === 0;
  const r1 = R + 26, r2 = R + (major ? 40 : 34);
  ticks += `<line x1="${cx + r1*Math.cos(a)}" y1="${cx + r1*Math.sin(a)}" x2="${cx + r2*Math.cos(a)}" y2="${cx + r2*Math.sin(a)}" stroke="var(--${major ? "line2" : "line"})" stroke-width="2" stroke-linecap="round"/>`;
}
const C = 2*Math.PI*R;
const frac = S.dial === "rest" ? 734/900 : S.dial === "risk" ? S.score/100 : 0;
const arcColor = S.dial === "rest" ? "var(--rest)" : (S.color || "var(--t1)");
const rot = start;
const dial = `<svg viewBox="0 0 ${size} ${size}">${ticks}
  <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="${C*span/360} ${C}" transform="rotate(${rot} ${cx} ${cx})"/>
  ${frac ? `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${arcColor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*span/360*frac} ${C}" transform="rotate(${rot} ${cx} ${cx})"/>` : ""}
</svg>
<div class="c">${S.dial === "rest"
  ? `<div class="num" style="font-size:136px">12:14</div><div class="cap">남은 휴식</div>`
  : S.dial === "risk" ? `<div class="num">${S.score}</div><div class="cap"><span class="state-dot" style="background:${S.color}"></span>졸음 위험 ${S.level}</div>`
  : `<div class="num" style="color:var(--t3)">0</div><div class="cap">졸음 위험</div>`}</div>`;

const prog = S.step < 0 ? 0 : S.step / (steps.length - 1) * 100;
const journey = `<div class="journey"><div class="rail"></div><div class="done" style="width:${prog}%"></div>
  ${steps.map((t,i)=>{const x=i/(steps.length-1)*100;const cls=i===S.step?"now":i<S.step?"past":"";return `<div class="node ${cls}" style="left:${x}%"></div>${i===S.step?`<div class="lab now" style="left:${x}%">${t}</div>`:""}`}).join("")}</div>`;

const heard = S.listening
  ? `<div class="heard"><svg class="spin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="6"/><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-opacity=".8" stroke-width="6" stroke-linecap="round" stroke-dasharray="${2*Math.PI*24*.28} 999" transform="rotate(-90 32 32)"/></svg>듣고 있어요</div>`
  : S.heard ? `<div class="heard"><b>“${S.heard}”</b>${S.lat} 만에 대답</div>` : "";

const actions = mode === "idle"
  ? `<button class="btn primary">운행 시작</button><span class="hint" style="margin-left:24px">대답은 말로 하면 돼요</span>`
  : mode === "rest"
  ? `<button class="btn primary">휴식 마치기</button><div class="spacer"></div><button class="btn quiet">운행 종료</button>`
  : `<button class="btn primary">지금 쉬기</button><button class="btn" disabled>휴식 취소</button><div class="spacer"></div><button class="btn quiet">운행 종료</button>`;

scr.innerHTML = `
<header><div class="word">쉼표</div>
  <div class="meta"><span><span class="state-dot" style="background:${mode==="rest"?"var(--rest)":"var(--t2)"}"></span>${S.meta}</span><span class="sep"></span><span class="tool">시연 도구</span></div></header>
<main>
  <div class="dial">${dial}</div>
  <div class="right">
    <div class="phase">${S.phase}</div>
    <div class="said">${S.said}</div>
    ${heard}
    ${journey}
    <div class="facts">
      <div class="fact"><small>연속 주행</small><span>${S.drive}<em>분</em></span></div>
      <div class="fact"><small>대답 속도</small><span>${S.resp}${S.resp!=="–"?"<em>배</em>":""}</span></div>
      <div class="fact"><small>${S.third[0]}</small><span>${S.third[1]}<em>${S.third[2]}</em></span></div>
    </div>
  </div>
</main>
<footer>${actions}</footer>
${drawer ? `<div class="scrim"></div><div class="drawer">
  <h2>시연 도구<span>닫기</span></h2>
  <div class="tabs"><div class="on">조작</div><div>기록</div><div>SDK 진단</div></div>
  <div class="group"><div class="rowx">시연 배속<em style="margin-left:auto;margin-right:24px">1초 = 1분</em><div class="sw"></div></div></div>
  <div class="group"><small>시각</small><div class="chips"><span>지금</span><span class="on">새벽 2시</span><span>오후 2시</span><span>오전 10시</span></div></div>
  <div class="group"><small>운전자 대답</small><div class="chips"><span>빠른 대답</span><span>느린 대답</span><span>무응답</span><span>“응, 쉬었다 가자”</span><span>“아니, 괜찮아”</span></div></div>
  <div class="group"><small>차량</small><div class="chips"><span class="on">주행</span><span>주차</span></div>
    <div style="margin-top:20px">${[["외기·송풍","켜짐"],["휴식 공조","꺼짐"],["등받이","꺼짐"],["실내 조명","꺼짐"]].map(([a,b])=>`<div class="rowx">${a}<em>${b}</em></div>`).join("")}</div></div>
</div>` : ""}`;
</script>
</body>
</html>
